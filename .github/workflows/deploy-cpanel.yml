name: Deploy backend to cPanel

on:
  push:
    branches:
      - staging
      - production
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production

concurrency:
  group: cpanel-backend-${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm run smoke

  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    needs: test
    if: github.ref_name == 'staging' || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.STAGING_CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_HOST: ${{ secrets.STAGING_CPANEL_SSH_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.STAGING_CPANEL_SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/cpanel_deploy_key
          chmod 600 ~/.ssh/cpanel_deploy_key
          ssh-keyscan -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload application files
        env:
          CPANEL_SSH_HOST: ${{ secrets.STAGING_CPANEL_SSH_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.STAGING_CPANEL_SSH_PORT || '22' }}
          CPANEL_SSH_USER: ${{ secrets.STAGING_CPANEL_SSH_USER }}
          CPANEL_REMOTE_PATH: ${{ secrets.STAGING_CPANEL_REMOTE_PATH }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='uploads/' \
            --exclude='private-uploads/' \
            --exclude='npm-debug.log*' \
            -e "ssh -i ~/.ssh/cpanel_deploy_key -p $CPANEL_SSH_PORT" \
            ./ "$CPANEL_SSH_USER@$CPANEL_SSH_HOST:$CPANEL_REMOTE_PATH/"

      - name: Install production dependencies and restart app
        env:
          CPANEL_SSH_HOST: ${{ secrets.STAGING_CPANEL_SSH_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.STAGING_CPANEL_SSH_PORT || '22' }}
          CPANEL_SSH_USER: ${{ secrets.STAGING_CPANEL_SSH_USER }}
          CPANEL_REMOTE_PATH: ${{ secrets.STAGING_CPANEL_REMOTE_PATH }}
          CPANEL_NODE_ACTIVATE: ${{ secrets.STAGING_CPANEL_NODE_ACTIVATE }}
        run: |
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" "
            set -e
            if [ -n '$CPANEL_NODE_ACTIVATE' ]; then
              . '$CPANEL_NODE_ACTIVATE'
            fi
            cd '$CPANEL_REMOTE_PATH'
            npm ci --omit=dev
            npm run check:production-env
            mkdir -p tmp uploads private-uploads
            touch tmp/restart.txt
          "

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref_name == 'production' || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_HOST: ${{ secrets.PRODUCTION_CPANEL_SSH_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.PRODUCTION_CPANEL_SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/cpanel_deploy_key
          chmod 600 ~/.ssh/cpanel_deploy_key
          ssh-keyscan -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload application files
        env:
          CPANEL_SSH_HOST: ${{ secrets.PRODUCTION_CPANEL_SSH_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.PRODUCTION_CPANEL_SSH_PORT || '22' }}
          CPANEL_SSH_USER: ${{ secrets.PRODUCTION_CPANEL_SSH_USER }}
          CPANEL_REMOTE_PATH: ${{ secrets.PRODUCTION_CPANEL_REMOTE_PATH }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='uploads/' \
            --exclude='private-uploads/' \
            --exclude='npm-debug.log*' \
            -e "ssh -i ~/.ssh/cpanel_deploy_key -p $CPANEL_SSH_PORT" \
            ./ "$CPANEL_SSH_USER@$CPANEL_SSH_HOST:$CPANEL_REMOTE_PATH/"

      - name: Install production dependencies and restart app
        env:
          CPANEL_SSH_HOST: ${{ secrets.PRODUCTION_CPANEL_SSH_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.PRODUCTION_CPANEL_SSH_PORT || '22' }}
          CPANEL_SSH_USER: ${{ secrets.PRODUCTION_CPANEL_SSH_USER }}
          CPANEL_REMOTE_PATH: ${{ secrets.PRODUCTION_CPANEL_REMOTE_PATH }}
          CPANEL_NODE_ACTIVATE: ${{ secrets.PRODUCTION_CPANEL_NODE_ACTIVATE }}
        run: |
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" "
            set -e
            if [ -n '$CPANEL_NODE_ACTIVATE' ]; then
              . '$CPANEL_NODE_ACTIVATE'
            fi
            cd '$CPANEL_REMOTE_PATH'
            npm ci --omit=dev
            npm run check:production-env
            mkdir -p tmp uploads private-uploads
            touch tmp/restart.txt
          "
